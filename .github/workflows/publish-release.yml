name: Publish release

on:
  release:
    types: [published]

jobs:
  # Tests run in their own job, which has no access to the signing key and the Central token
  # It also rejects releases that must not be published, before the publish job asks for approval
  test:
    # Pre-releases are not published to Maven Central
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    # Only commits that are on main are released
    - name: Check that the release commit is on main
      run: 'git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Release commit $GITHUB_SHA is not on main"; exit 1; }'
    # Only tags of the form vX.Y.Z are released
    - name: Check the release tag
      run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tag $GITHUB_REF_NAME is not of the form vX.Y.Z"; exit 1; }'
    - name: Set up JDK 8
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '8'
        distribution: 'zulu'
    # The version is set by hand in pom.xml before tagging, so the tag has to match it
    - name: Check that the release tag matches the version in pom.xml
      run: |
        version=$(mvn -B -q org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=project.version -DforceStdout)
        [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "::error::Release tag $GITHUB_REF_NAME does not match version $version in pom.xml"; exit 1; }
    - name: Run tests
      run: mvn -B verify

  publish:
    needs: test
    runs-on: ubuntu-latest
    # The signing key and the Central token are environment secrets, only available to deployments that pass its rules
    environment: maven-central
    # Releases are uploaded one at a time; a running upload is never cancelled
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
    # Actions are pinned by commit SHA because this job holds the signing key
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up JDK 8
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '8'
        distribution: 'zulu'
        server-id: central
        server-username-env-var: MAVEN_CENTRAL_USERNAME
        server-password-env-var: MAVEN_CENTRAL_PASSWORD
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

    - name: Publish to Maven Central
      run: mvn -B -P release deploy -Dmaven.test.skip=true
      env:
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
